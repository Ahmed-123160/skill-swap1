<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Skill Swap</title>
    <link rel="stylesheet" href="common.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <a href="index.html" class="logo"><span>Skill</span> <span>Swap</span></a>
        <h2>Sign In</h2>

        <div id="errorMsg" class="alert alert-error"></div>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-block">Login</button>
        </form>

        <div class="auth-link">Don't have an account? <a href="register.html">Join Now</a></div>
    </div>

    <script src="common.js"></script>
    <script>
        // لو مسجل دخول بالفعل ما يفتحش صفحة الدخول
        if (getUser()) window.location.href = 'dashboard.html';

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorDiv = document.getElementById('errorMsg');

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => { errorDiv.style.display = 'none'; }, 5000);
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorDiv.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            try {
                const res = await apiFetch('/api/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    // token هييجي من الباك إند بعد ما نضيف JWT
                    saveSession(res.data.user, res.data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    showError((res.data && res.data.detail) || 'Invalid email or password');
                }
            } catch (error) {
                showError('Cannot connect to server');
            } finally {
                submitBtn.textContent = 'Login';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
