<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Skill Swap</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <div id="app-header"></div>

    <div class="container stack">
        <div class="card">
            <div class="row" style="align-items:stretch">
                <input type="text" id="searchInput" class="search-input" style="flex:2 1 240px"
                       placeholder="Search by name or skill..." aria-label="Search">
                <select id="skillFilter" class="search-input" style="flex:1 1 180px" aria-label="Filter by skill"></select>
                <select id="typeFilter" class="search-input" style="flex:1 1 160px" aria-label="Filter type" disabled>
                    <option value="">Teaches or learns</option>
                    <option value="teach">Teaches it</option>
                    <option value="learn">Wants to learn it</option>
                </select>
            </div>
        </div>

        <div id="resultsInfo" class="muted small"></div>
        <div id="results" class="grid"></div>
    </div>

    <script src="common.js"></script>
    <script>
        const me = requireLogin();
        let timer = null;
        let searchCounter = 0;   // عشان نتجاهل نتيجة بحث قديم وصلت متأخرة

        if (me) init();

        async function init() {
            renderHeader('search');
            // الكلمة اللي جاية من الصفحة الرئيسية
            const q = new URLSearchParams(window.location.search).get('q') || '';
            document.getElementById('searchInput').value = q;

            document.getElementById('searchInput').addEventListener('input', schedule);
            document.getElementById('skillFilter').addEventListener('change', () => {
                document.getElementById('typeFilter').disabled = !document.getElementById('skillFilter').value;
                if (!document.getElementById('skillFilter').value) document.getElementById('typeFilter').value = '';
                runSearch();
            });
            document.getElementById('typeFilter').addEventListener('change', runSearch);

            const cat = await call('/api/skills');
            if (cat.ok) {
                const groups = {};
                cat.data.skills.forEach(s => (groups[s.category] = groups[s.category] || []).push(s));
                document.getElementById('skillFilter').innerHTML = '<option value="">Any skill</option>' +
                    Object.keys(groups).map(c => `<optgroup label="${escapeHtml(c)}">` +
                        groups[c].map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('') +
                        '</optgroup>').join('');
            }
            runSearch();
        }

        function schedule() {
            clearTimeout(timer);
            timer = setTimeout(runSearch, 300);
        }

        async function runSearch() {
            const ticket = ++searchCounter;
            const params = new URLSearchParams();
            const q = document.getElementById('searchInput').value.trim();
            const skill = document.getElementById('skillFilter').value;
            const type = document.getElementById('typeFilter').value;
            if (q) params.set('q', q);
            if (skill) {
                params.set('skill_id', skill);
                if (type) params.set('skill_type', type);
            }
            const res = await call('/api/users?' + params.toString());
            if (ticket !== searchCounter) return;   // وصل بحث أحدث، تجاهل ده
            if (res.ok) display(res.data.users);
        }

        function display(users) {
            document.getElementById('resultsInfo').textContent =
                users.length ? users.length + ' people found' : '';
            const box = document.getElementById('results');
            if (!users.length) {
                box.innerHTML = '<div class="empty" style="grid-column:1/-1">No users found. Try another word or skill.</div>';
                return;
            }
            box.innerHTML = users.map(u => {
                const skills = u.skills || [];
                const shown = skills.slice(0, 6);
                return `<div class="user-card" data-id="${u.id}">
                    <div class="row">
                        <div class="avatar">${initial(u.name)}</div>
                        <div style="min-width:0">
                            <div class="user-name">${escapeHtml(u.name)}</div>
                            <div class="muted small">${escapeHtml(u.location || 'Location not set')}</div>
                        </div>
                    </div>
                    <div>${stars(u.avg_rating, u.reviews_count)}
                        <span class="small muted"> · ${u.completed_sessions || 0} sessions</span></div>
                    <div>${shown.map(s => `<span class="chip ${s.skill_type === 'learn' ? 'chip-learn' : ''}"
                        title="${s.skill_type === 'teach' ? 'Teaches' : 'Wants to learn'}">${s.skill_type === 'teach' ? '🎓' : '📚'} ${escapeHtml(s.name)}</span>`).join('')}
                        ${skills.length > shown.length ? `<span class="small muted">+${skills.length - shown.length} more</span>` : ''}</div>
                </div>`;
            }).join('');
            box.querySelectorAll('.user-card').forEach(c =>
                c.addEventListener('click', () => window.location.href = 'profile.html?id=' + c.dataset.id));
        }
    </script>
</body>
</html>
