<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Skill Swap</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <div id="app-header"></div>

    <div class="container narrow stack">
        <div><button class="btn btn-gray btn-sm" onclick="history.length > 1 ? history.back() : window.location.href='search.html'">← Back</button></div>
        <div id="profile" class="stack"><div class="empty">Loading profile...</div></div>
    </div>

    <!-- طلب تبادل -->
    <div id="swapModal" class="modal-backdrop" hidden>
        <div class="modal">
            <h3>Request a swap</h3>
            <div class="field">
                <label for="wantedSelect">I want to learn</label>
                <select id="wantedSelect"></select>
            </div>
            <div class="field">
                <label for="offeredSelect">In return I can teach</label>
                <select id="offeredSelect"></select>
            </div>
            <div class="field">
                <label for="swapMessage">Message (optional)</label>
                <textarea id="swapMessage" maxlength="500" placeholder="Say hello and when you are free..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-gray btn-sm" id="swapCancel">Cancel</button>
                <button class="btn btn-sm" id="swapSend">Send request</button>
            </div>
        </div>
    </div>

    <!-- إبلاغ عن فيديو -->
    <div id="reportModal" class="modal-backdrop" hidden>
        <div class="modal">
            <h3>Report this video</h3>
            <div class="field">
                <label for="reportReason">Reason</label>
                <select id="reportReason">
                    <option value="inappropriate">Inappropriate content</option>
                    <option value="spam">Spam</option>
                    <option value="misleading">Misleading</option>
                    <option value="copyright">Copyright</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="field">
                <label for="reportDetails">Details (optional)</label>
                <textarea id="reportDetails" maxlength="500"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-gray btn-sm" id="reportCancel">Cancel</button>
                <button class="btn btn-danger btn-sm" id="reportSend">Send report</button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        const me = requireLogin();
        const userId = parseInt(new URLSearchParams(window.location.search).get('id'));
        let profile = null;
        let myTeach = [];
        let reportVideoId = null;

        if (me) init();

        async function init() {
            renderHeader('');
            if (!userId) return showMissing();
            const [res, mine] = await Promise.all([call('/api/users/' + userId), call('/api/my/skills')]);
            if (!res.ok) return showMissing();
            profile = res.data;
            if (mine.ok) myTeach = mine.data.skills.filter(s => s.skill_type === 'teach');
            render();

            document.getElementById('swapCancel').onclick = () => closeModal('swapModal');
            document.getElementById('swapSend').onclick = sendSwap;
            document.getElementById('reportCancel').onclick = () => closeModal('reportModal');
            document.getElementById('reportSend').onclick = sendReport;
        }

        function showMissing() {
            document.getElementById('profile').innerHTML = '<div class="card empty">This profile does not exist.</div>';
        }

        function render() {
            const isMe = profile.id === me.id;
            const teach = profile.skills.filter(s => s.skill_type === 'teach');
            const learn = profile.skills.filter(s => s.skill_type === 'learn');
            document.title = profile.name + ' - Skill Swap';

            const chips = (list, cls) => list.length
                ? list.map(s => `<span class="chip ${cls}">${escapeHtml(s.name)}</span>`).join('')
                : '<span class="muted">Nothing listed</span>';

            document.getElementById('profile').innerHTML = `
                <div class="card">
                    <div class="row" style="gap:20px">
                        <div class="avatar avatar-lg">${initial(profile.name)}</div>
                        <div style="min-width:0">
                            <h2>${escapeHtml(profile.name)}</h2>
                            <div class="muted">📍 ${escapeHtml(profile.location || 'Location not set')}</div>
                            <div style="margin-top:6px">${stars(profile.avg_rating, profile.reviews_count)}
                                <span class="small muted"> · ${profile.completed_sessions || 0} sessions taught</span></div>
                        </div>
                    </div>
                    ${isMe ? '<p class="muted small" style="margin-top:14px">This is how others see your profile.</p>' : `
                    <div class="row" style="margin-top:18px">
                        <button class="btn" id="swapBtn" ${teach.length ? '' : 'disabled title="This user has not listed any skill to teach"'}>🔄 Request a swap</button>
                        <a class="btn btn-outline" href="chat.html?user=${profile.id}">💬 Send message</a>
                    </div>`}
                </div>

                <div class="card">
                    <h3>🎓 Skills I Can Teach</h3>${chips(teach, '')}
                    <h3 style="margin-top:18px">📚 Skills I Want to Learn</h3>${chips(learn, 'chip-learn')}
                </div>

                <div class="card">
                    <h3>🎬 Videos</h3>
                    ${profile.videos.length ? `<div class="grid">${profile.videos.map(v => `
                        <div class="video-card">
                            <video controls preload="metadata" src="${videoUrl(v.id)}"></video>
                            <b>${escapeHtml(v.title)}</b>
                            ${v.skill_name ? `<div class="small muted">${escapeHtml(v.skill_name)}</div>` : ''}
                            ${v.description ? `<div class="small">${escapeHtml(v.description)}</div>` : ''}
                            ${isMe ? '' : `<div><button class="btn btn-outline btn-sm" data-report="${v.id}">Report</button></div>`}
                        </div>`).join('')}</div>` : '<div class="empty">No videos yet.</div>'}
                </div>

                <div class="card">
                    <h3>⭐ Reviews</h3>
                    ${profile.reviews.length ? profile.reviews.map(r => `
                        <div class="review">
                            <div class="row spread">
                                <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                                <span class="small muted">${formatDate(r.created_at)}</span>
                            </div>
                            ${r.comment ? `<div>${escapeHtml(r.comment)}</div>` : ''}
                            <div class="small muted">${escapeHtml(r.reviewer_name)} · ${escapeHtml(r.skill_name)}</div>
                        </div>`).join('') : '<div class="empty">No reviews yet.</div>'}
                </div>`;

            const swapBtn = document.getElementById('swapBtn');
            if (swapBtn) swapBtn.onclick = openSwap;
            document.querySelectorAll('[data-report]').forEach(b =>
                b.addEventListener('click', () => { reportVideoId = b.dataset.report; openModal('reportModal'); }));
        }

        // ---------- طلب تبادل ----------
        function openSwap() {
            const teach = profile.skills.filter(s => s.skill_type === 'teach');
            document.getElementById('wantedSelect').innerHTML =
                teach.map(s => `<option value="${s.skill_id}">${escapeHtml(s.name)}</option>`).join('');
            document.getElementById('offeredSelect').innerHTML =
                '<option value="">Nothing, I just want to learn</option>' +
                myTeach.map(s => `<option value="${s.skill_id}">${escapeHtml(s.name)}</option>`).join('');
            document.getElementById('swapMessage').value = '';
            openModal('swapModal');
        }

        async function sendSwap() {
            const offered = document.getElementById('offeredSelect').value;
            const btn = document.getElementById('swapSend');
            btn.disabled = true;
            const res = await call('/api/requests', {
                method: 'POST',
                body: JSON.stringify({
                    receiver_id: profile.id,
                    skill_wanted_id: Number(document.getElementById('wantedSelect').value),
                    skill_offered_id: offered ? Number(offered) : null,
                    message: document.getElementById('swapMessage').value.trim() || null,
                }),
            }, 'Request sent');
            btn.disabled = false;
            if (res.ok) closeModal('swapModal');
        }

        // ---------- بلاغ ----------
        async function sendReport() {
            const res = await call(`/api/videos/${reportVideoId}/report`, {
                method: 'POST',
                body: JSON.stringify({
                    reason: document.getElementById('reportReason').value,
                    details: document.getElementById('reportDetails').value.trim() || null,
                }),
            }, 'Report sent. Thank you.');
            if (res.ok) closeModal('reportModal');
        }
    </script>
</body>
</html>
