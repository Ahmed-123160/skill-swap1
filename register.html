<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Skill Swap</title>
    <link rel="stylesheet" href="common.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <a href="index.html" class="logo"><span>Skill</span> <span>Swap</span></a>
        <h2>Create Account</h2>

        <div id="errorMsg" class="alert alert-error"></div>
        <div id="successMsg" class="alert alert-success"></div>

        <form id="registerForm" novalidate>
            <div class="input-group">
                <input type="text" id="fullname" placeholder="Full Name" autocomplete="name" required>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" autocomplete="new-password" required>
            </div>

            <div class="password-rules" id="passwordRules"></div>

            <div class="input-group">
                <input type="password" id="confirm_password" placeholder="Confirm Password" autocomplete="new-password" required>
            </div>
            <div class="input-group">
                <input type="text" id="location" placeholder="Location (optional)">
            </div>

            <button type="submit" id="submitBtn" class="btn btn-block">Join Now</button>
        </form>

        <div class="auth-link">Already have an account? <a href="login.html">Login</a></div>
    </div>

    <script src="common.js"></script>
    <script>
        if (getUser()) window.location.href = 'dashboard.html';

        // ---------- قواعد الباسورد (مكان واحد بس) ----------
        const PASSWORD_RULES = [
            { label: '8+ characters', test: p => p.length >= 8,
              error: 'Password must be at least 8 characters' },
            { label: 'Uppercase',     test: p => /[A-Z]/.test(p),
              error: 'Password must contain an uppercase letter (A-Z)' },
            { label: 'Lowercase',     test: p => /[a-z]/.test(p),
              error: 'Password must contain a lowercase letter (a-z)' },
            { label: 'Number',        test: p => /\d/.test(p),
              error: 'Password must contain a number (0-9)' },
            { label: 'Special char',  test: p => /[^A-Za-z0-9]/.test(p),
              error: 'Password must contain a special character (!@#$%^&*)' }
        ];

        const rulesBox = document.getElementById('passwordRules');
        const passwordInput = document.getElementById('password');

        function renderRules(password) {
            rulesBox.innerHTML = PASSWORD_RULES.map(rule => {
                const ok = rule.test(password);
                return `<span class="rule ${ok ? 'met' : ''}">${ok ? '✓' : '✗'} ${rule.label}</span>`;
            }).join('');
        }

        // أول ما اليوزر يكتب يتحدث على طول
        passwordInput.addEventListener('input', e => renderRules(e.target.value));
        renderRules('');

        function validatePassword(password) {
            const failed = PASSWORD_RULES.find(rule => !rule.test(password));
            return failed ? failed.error : null;
        }

        // ---------- رسائل ----------
        const errorDiv = document.getElementById('errorMsg');
        const successDiv = document.getElementById('successMsg');

        function showError(message) {
            successDiv.style.display = 'none';
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => { errorDiv.style.display = 'none'; }, 5000);
        }

        // ---------- إرسال الفورم ----------
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // submitBtn بيتعرّف الأول عشان نقدر نستخدمه في أي حالة
            const submitBtn = document.getElementById('submitBtn');

            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            const confirm = document.getElementById('confirm_password').value;
            const location = document.getElementById('location').value.trim();

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!fullname || !email || !password) {
                return showError('Please fill all required fields');
            }

            const passwordError = validatePassword(password);
            if (passwordError) return showError(passwordError);

            if (password !== confirm) {
                return showError('Passwords do not match');
            }

            submitBtn.textContent = 'Creating account...';
            submitBtn.disabled = true;

            try {
                const res = await apiFetch('/api/register', {
                    method: 'POST',
                    body: JSON.stringify({ name: fullname, email, password, location })
                });

                if (res.ok) {
                    successDiv.textContent = '✅ Account created successfully! Redirecting to login...';
                    successDiv.style.display = 'block';
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                    return; // الزرار يفضل متعطل لحد التحويل
                }
                showError((res.data && res.data.detail) || 'Registration failed');
            } catch (error) {
                showError('Cannot connect to server. Make sure backend is running: python backend.py');
            }

            submitBtn.textContent = 'Join Now';
            submitBtn.disabled = false;
        });
    </script>
</body>
</html>
